name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-shards:
    name: backend shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - run: git fetch --no-tags --depth=1 origin refs/tags/v0.5.13:refs/tags/v0.5.13
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: python -m venv .venv-test
      - run: .\.venv-test\Scripts\python.exe -m pip install -r requirements-test.txt
      - run: node scripts/test-quiet.cjs backend --shard-index ${{ matrix.shard }} --shard-total 2 --artifacts "${{ runner.temp }}/mozarie-coverage"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/mozarie-coverage/backend
          if-no-files-found: warn
          include-hidden-files: true

  backend:
    name: backend
    if: always()
    needs: backend-shards
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m venv .venv-test
      - run: .\.venv-test\Scripts\python.exe -m pip install "coverage>=7.10,<8"
      - if: always()
        uses: actions/download-artifact@v7
        with:
          pattern: backend-coverage-*
          path: ${{ runner.temp }}/backend-shards
          merge-multiple: false
      - name: Require successful backend shards
        if: needs.backend-shards.result != 'success'
        run: |
          throw "backend shard result: ${{ needs.backend-shards.result }}"
      - run: node scripts/test-quiet.cjs backend-aggregate --shard-artifacts "${{ runner.temp }}/backend-shards" --artifacts "${{ runner.temp }}/mozarie-coverage"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/mozarie-coverage/backend
          if-no-files-found: warn
          include-hidden-files: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/test-quiet.cjs frontend --artifacts "${{ runner.temp }}/mozarie-coverage"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: ${{ runner.temp }}/mozarie-coverage/frontend
          if-no-files-found: warn
